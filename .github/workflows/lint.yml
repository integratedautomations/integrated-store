name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check custom_components/integrated_store
      - run: ruff format --check custom_components/integrated_store

  json:
    name: json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files parse
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for path in pathlib.Path(".").rglob("*.json"):
              if ".git" in path.parts:
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except ValueError as err:
                  bad.append(f"{path}: {err}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("All JSON files parse.")
          PY
