name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so upstream hassfest/HACS rule changes surface before a release.
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # This repo is a private/self-published store, so the brands check
          # (which requires an entry in home-assistant/brands) is not applicable.
          ignore: brands
